<title id="ana-connections-title">From an open role to a verified credit</title><desc id="ana-connections-desc">Swimlane across the house, the person and everyone else: a role is opened, the person shows interest, the house reviews and closes the role, adds the person, issues a credit, the person accepts and it becomes public.</desc>
