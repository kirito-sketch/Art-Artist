<title id="ana-j9-title">Staying safe: report and block</title><desc id="ana-j9-desc">Flowchart: from any profile, house, project, role or post, a person reports with a reason, which goes to the moderation console, and is offered to block; blocking hides both sides everywhere while keeping records.</desc>
