<svg id="ana-l-credit" class="dd" viewBox="0 0 820 320" width="820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ana-l-credit-title ana-l-credit-desc" style="min-width:820px;max-width:none">
<title id="ana-l-credit-title">Credit lifecycle</title><desc id="ana-l-credit-desc">State machine: a credit is prepared or issued by the house; the person accepts it or asks for a correction, which the house reissues as the same record; an accepted credit can only change through an amendment the person accepts.</desc>
