<title id="ana-j4-title">A production house gets onto Ana</title><desc id="ana-j4-desc">Flowchart: a house arrives by sales-assisted invite, which must be accepted with the invited address, or by self-serve setup; it prepares privately until Ana verifies it, which unlocks public roles, credits and search.</desc>
