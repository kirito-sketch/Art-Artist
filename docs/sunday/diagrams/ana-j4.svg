<svg id="ana-j4" class="dd" viewBox="0 0 760 680" width="760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ana-j4-title ana-j4-desc" style="min-width:760px;max-width:none">
<title id="ana-j4-title">A production house gets onto Ana</title><desc id="ana-j4-desc">Flowchart: Art and Artist&#x27;s sales team visits a production house; if it agrees, the team checks its documents and creates the house account, a sign-in goes to the house&#x27;s team member, and they sign in to the house Home. Houses never sign up themselves.</desc>
